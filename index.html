<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raw ThreadZ — Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />

  <link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;700&family=Bodoni+Moda:wght@900&display=swap" rel="stylesheet" />

  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo">RAW THREADZ</div>

    <nav class="nav">
      <a href="#">Home</a>
      <a href="#" class="active">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <button class="cart-btn" id="cartButton">
      Cart <span id="cartCount">0</span>
    </button>
  </div>
</header>

<main>

<div id="banner" class="banner" hidden></div>

<section class="hero">
  <div class="container hero-inner">
    <h1>Unscripted Streetwear.</h1>
    <p>Bold, unapologetic, high-quality clothing.</p>
  </div>
</section>

<section class="products-section">
  <div class="container">

    <div class="products-header">
      <h2>All Products</h2>

      <div class="filters">
        <input id="searchInput" placeholder="Search..." />
        <select id="sortSelect">
          <option value="featured">Featured</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
        </select>
      </div>
    </div>

    <div id="productsGrid" class="products-grid"></div>

  </div>
</section>

</main>

<!-- CART -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-inner">

    <button id="cartClose" class="cart-close">&times;</button>

    <h3>Your Cart</h3>

    <div id="cartItems"></div>
    <p id="cartEmpty" class="cart-empty">Your cart is empty.</p>

    <div class="cart-footer">
      Total: $<span id="cartTotal">0.00</span>
      <button id="checkoutBtn" class="btn-primary checkout-btn" disabled>Checkout</button>
      <p id="cartStatus" class="cart-empty" aria-live="polite"></p>
    </div>

  </div>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year"></span> Raw ThreadZ</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
